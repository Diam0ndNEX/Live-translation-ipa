name: ScreenLingo
options:
  bundleIdPrefix: com.diam0ndnex
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.8.0"
    CURRENT_PROJECT_VERSION: "10"
targets:
  ScreenTranslator:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - target: BroadcastExtension
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ScreenLingo
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.diam0ndnex.screenlingo
        PRODUCT_NAME: ScreenLingo
  BroadcastExtension:
    type: app-extension
    platform: iOS
    sources: [BroadcastExtension, Shared]
    info:
      path: BroadcastExtension/Info.plist
      properties:
        CFBundleDisplayName: ScreenLingo Capture
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.diam0ndnex.screenlingo.broadcast
        PRODUCT_NAME: ScreenLingoCapture
