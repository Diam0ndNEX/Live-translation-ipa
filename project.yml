name: ScreenTranslator
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "3"
targets:
  ScreenTranslator:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - target: BroadcastExtension
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Screen Translator
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.screentranslator
  BroadcastExtension:
    type: app-extension
    platform: iOS
    sources: [BroadcastExtension, Shared]
    info:
      path: BroadcastExtension/Info.plist
      properties:
        CFBundleDisplayName: Translator Capture
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.screentranslator.broadcast
