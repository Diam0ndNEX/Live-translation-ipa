name: Build ScreenLingo IPA
on:
  workflow_dispatch:
  push:
    branches:
      - codex/screenlingo-v0.7.0
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen librsvg
      - name: Generate app icon and project
        run: |
          mkdir -p App/Assets.xcassets/AppIcon.appiconset
          rsvg-convert -w 1024 -h 1024 App/ScreenLingoIcon.svg -o App/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          printf '%s\n' '{"images":[{"filename":"AppIcon.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > App/Assets.xcassets/AppIcon.appiconset/Contents.json
          xcodegen generate
      - name: Build
        run: |
          xcodebuild -project ScreenLingo.xcodeproj -scheme ScreenLingo \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/ScreenLingo.app Payload/ScreenLingo.app
          zip -r ScreenLingo.ipa Payload
      - name: Verify packaged app and extension versions
        run: |
          set -euo pipefail
          APP="Payload/ScreenLingo.app"
          EXPECTED_VERSION="1.2.0"
          EXPECTED_BUILD="15"
          APP_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          APP_BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist")
          echo "Main app version: $APP_VERSION ($APP_BUILD)"
          test "$APP_VERSION" = "$EXPECTED_VERSION"
          test "$APP_BUILD" = "$EXPECTED_BUILD"
          EXT=$(find "$APP/PlugIns" -maxdepth 1 -type d -name "*.appex" -print -quit)
          test -n "$EXT"
          EXT_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$EXT/Info.plist")
          EXT_BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$EXT/Info.plist")
          echo "Capture extension version: $EXT_VERSION ($EXT_BUILD)"
          test "$EXT_VERSION" = "$EXPECTED_VERSION"
          test "$EXT_BUILD" = "$EXPECTED_BUILD"
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenLingo-ipa
          path: ScreenLingo.ipa
