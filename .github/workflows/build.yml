name: Build unsigned IPA
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen && xcodegen generate
      - name: Build
        run: |
          xcodebuild -project ScreenTranslator.xcodeproj -scheme ScreenTranslator \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/ScreenTranslator.app Payload/
          zip -r ScreenTranslator.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslator-ipa
          path: ScreenTranslator.ipa
