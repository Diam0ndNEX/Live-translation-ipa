name: Build ScreenLingo IPA
on:
  push:
    branches: [codex/screenlingo-v1.9.5-full-performance, codex/screenlingo-v1.9.4-measured-reliability, codex/screenlingo-v1.9.3-prediction-diagnostics, codex/screenlingo-v1.9.2-hybrid-reliability, codex/screenlingo-v1.9.1-hybrid-performance, codex/screenlingo-v1.9.0-three-modes, codex/screenlingo-v0.7.0, codex/screenlingo-v0.8.0, codex/screenlingo-v0.9.0, codex/screenlingo-v1.0.0, codex/screenlingo-v1.1.0, codex/screenlingo-v1.2.0, codex/screenlingo-v1.2.1, codex/screenlingo-v1.3.0, codex/screenlingo-v1.4.1, codex/screenlingo-v1.4.1-static-overlay, codex/screenlingo-v1.4.1-diagnostics, codex/screenlingo-v1.4.2, codex/screenlingo-v1.4.3-batch-memory, codex/screenlingo-v1.4.4-performance, codex/screenlingo-v1.4.5-latency, codex/screenlingo-v1.4.6-validation, codex/screenlingo-v1.4.7-intelligence, codex/screenlingo-v1.4.8-continuity, codex/screenlingo-v1.5.0-refinement, codex/screenlingo-v1.7.0-performance, codex/screenlingo-v1.7.1-testing, codex/screenlingo-v1.7.2-performance]
  pull_request:
    branches: [codex/screenlingo-v1.9.4-measured-reliability, codex/screenlingo-v1.3.0, codex/screenlingo-v1.4.0, codex/screenlingo-v1.4.1, codex/screenlingo-v1.4.2, codex/screenlingo-v1.4.3-batch-memory, codex/screenlingo-v1.4.4-performance, codex/screenlingo-v1.4.5-latency, codex/screenlingo-v1.4.6-validation, "codex/memory2-**"]
  workflow_dispatch:
    inputs:
      interface_preview:
        description: Run the optional iPhone simulator screenshot
        required: false
        type: boolean
        default: false
concurrency:
  group: screenlingo-ipa-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"
      - name: Enforce nominal/fair full-performance parity
        run: python3 scripts/test_thermal_parity.py
      - name: Check pipeline regressions
        run: |
          swiftc Shared/*.swift App/TextIntelligence.swift App/CaptionAssembly.swift App/MemoryWriter.swift App/PipelineSimulation.swift Tests/main.swift -o /tmp/pipeline-tests
          /tmp/pipeline-tests
      - name: Verify three-mode coordinator and source contract
        run: |
          swiftc -parse-as-library Shared/SharedTranslationWork.swift Shared/TranslationSystem.swift Shared/CaptionFocus.swift Shared/CaptureReadiness.swift Shared/TranslationActivity.swift Tests/ThreeModes/main.swift -o /tmp/three-mode-tests
          /tmp/three-mode-tests
          python3 scripts/test_three_modes.py
          python3 scripts/test_compare_three_modes.py
      - name: Verify three-mode diagnostics live routing
        run: python3 scripts/test_mode_diagnostics_ui.py
      - name: Verify performance acceptance gate
        run: python3 scripts/test_compare_performance.py
      - name: Verify Experimental Features controls
        run: python3 scripts/test_experimental_settings.py
      - name: Check SQLite memory migration
        run: bash scripts/test_memory.sh
      - name: Check local capture transport
        run: bash scripts/test_transport.sh
      - name: Check diagnostic archive privacy and correlation
        run: bash scripts/test_diagnostics.sh
      - name: Storage scaling smoke benchmark
        run: bash scripts/benchmark_memory.sh 3000 25000
      - name: Generate app icon
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install pillow
          python scripts/make_icon.py App/Assets.xcassets
      - run: brew install xcodegen && xcodegen generate
      - name: Build
        run: |
          set -euo pipefail
          xcodebuild -project ScreenLingo.xcodeproj -scheme ScreenLingo \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Verify app and extension metadata
        run: |
          python3 - <<'PY'
          import plistlib, re
          from pathlib import Path
          source = Path('Shared/Shared.swift').read_text()
          version = re.search(r'static let version = "([^"]+)"', source)[1]
          build = re.search(r'static let build = (\d+)', source)[1]
          app = Path('build/Build/Products/Release-iphoneos/ScreenLingo.app')
          extensions = list((app / 'PlugIns').glob('*.appex'))
          assert len(extensions) == 1, 'Expected one capture extension'
          for bundle in [app, *extensions]:
              with (bundle / 'Info.plist').open('rb') as f:
                  info = plistlib.load(f)
              assert info['CFBundleShortVersionString'] == version, info
              assert info['CFBundleVersion'] == build, info
              assert info['CFBundleIdentifier'].startswith('com.diam0ndnex.screenlingo'), info
          print(f'Verified app and extension: {version} ({build})')
          PY
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/ScreenLingo.app Payload/
          zip -qr ScreenLingo.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenLingo-ipa
          path: ScreenLingo.ipa
          if-no-files-found: error
          retention-days: 90
      - name: Preview interface on iPhone simulator
        if: github.event_name == 'workflow_dispatch' && inputs.interface_preview
        timeout-minutes: 12
        run: bash scripts/preview_interface.sh
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.interface_preview
        with:
          name: ScreenLingo-interface-preview
          path: interface-preview
          if-no-files-found: error
          retention-days: 90

