name: Build ScreenLingo IPA
on:
  push:
    branches: ["claude/**", codex/screenlingo-v1.9.9-recovery-evidence]
  pull_request:
    branches: ["claude/**", codex/screenlingo-v1.9.9-recovery-evidence]
  workflow_dispatch:
    inputs:
      interface_preview:
        description: Run the optional iPhone simulator screenshot
        required: false
        type: boolean
        default: false
concurrency:
  group: screenlingo-ipa-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"
      - name: Enforce nominal/fair full-performance parity
        run: python3 scripts/test_thermal_parity.py
      - name: Verify v1.9.9 recovery and OCR regression contract
        run: python3 scripts/test_v199_performance.py
      - name: Verify v2.2.1 source contracts
        run: python3 scripts/test_v221_contracts.py
      - name: Verify v2.2.2 source contracts (PiP start, large-text layouts)
        run: python3 scripts/test_v222_contracts.py
      - name: Verify v2.2.3 source contracts (L5 background availability refresh)
        run: python3 scripts/test_v223_contracts.py
      - name: Verify v2.3.0 source contracts (Legacy diagnostics labels, supersession measurement)
        run: python3 scripts/test_v230_contracts.py
      - name: Verify v2.3.1 source contracts (cross-mode diagnostics names)
        run: python3 scripts/test_v231_contracts.py
      - name: Verify v2.3.2 source contracts (Diagnostics tabs show the 2.3 data)
        run: python3 scripts/test_v232_contracts.py
      - name: Diagnostic allowlist guards (2.2.1 C2, C3)
        run: python3 scripts/test_diag_allowlists.py
      - name: Library history rules and debounced save (2.2.1 E1, E15)
        run: |
          swiftc -parse-as-library Shared/HistoryPolicy.swift Tests/HistoryPolicy/main.swift -o /tmp/history-policy-tests
          /tmp/history-policy-tests
      - name: Check pipeline regressions
        run: |
          swiftc Shared/*.swift $(bash scripts/swift_sources.sh TextIntelligence CaptionAssembly MemoryWriter PipelineSimulation) Tests/main.swift -o /tmp/pipeline-tests
          /tmp/pipeline-tests
      - name: Verify three-mode coordinator and source contract
        run: |
          swiftc -parse-as-library Shared/SharedTranslationWork.swift $(bash scripts/swift_sources.sh TranslationSystem) Shared/CaptionFocus.swift Shared/CaptureReadiness.swift Shared/TranslationActivity.swift Tests/ThreeModes/main.swift -o /tmp/three-mode-tests
          /tmp/three-mode-tests
          python3 scripts/test_three_modes.py
          python3 scripts/test_compare_three_modes.py
      - name: Verify deterministic LL Legacy and Hybrid timed A/B matrix
        run: |
          swiftc -parse-as-library Shared/SharedTranslationWork.swift $(bash scripts/swift_sources.sh TranslationSystem) Shared/CaptionFocus.swift Shared/CaptureReadiness.swift Shared/TranslationActivity.swift Tests/HotPathAB/main.swift -o /tmp/screenlingo-v196-timed-tests
          /tmp/screenlingo-v196-timed-tests
      - name: Compile isolated reference Hybrid and confirmed-probe variants
        run: |
          swiftc -parse-as-library -D SCREENLINGO_REFERENCE_CONFIRMED_PROBE -D SCREENLINGO_REFERENCE_HYBRID_PREFLIGHT -D SCREENLINGO_HYBRID_REFERENCE Shared/SharedTranslationWork.swift $(bash scripts/swift_sources.sh TranslationSystem) Shared/CaptionFocus.swift Shared/CaptureReadiness.swift Shared/TranslationActivity.swift Tests/HotPathAB/main.swift -o /tmp/screenlingo-v197-reference-tests
          /tmp/screenlingo-v197-reference-tests
          swiftc -parse-as-library -D SCREENLINGO_HYBRID_RECOVERY_FIRST Shared/SharedTranslationWork.swift $(bash scripts/swift_sources.sh TranslationSystem) Shared/CaptionFocus.swift Shared/CaptureReadiness.swift Shared/TranslationActivity.swift Tests/HotPathAB/main.swift -o /tmp/screenlingo-v197-recovery-first-tests
          /tmp/screenlingo-v197-recovery-first-tests
      - name: Verify isolated Hybrid reference spacing build
        run: |
          swiftc -parse-as-library -D SCREENLINGO_REFERENCE_HYBRID_EXIT_SETTLING Shared/SharedTranslationWork.swift $(bash scripts/swift_sources.sh TranslationSystem) Shared/CaptionFocus.swift Shared/CaptureReadiness.swift Shared/TranslationActivity.swift Tests/ThreeModes/main.swift -o /tmp/v199-hybrid-reference
          /tmp/v199-hybrid-reference
      - name: Verify three-mode diagnostics live routing
        run: python3 scripts/test_mode_diagnostics_ui.py
      - name: Verify performance acceptance gate
        run: python3 scripts/test_compare_performance.py
      - name: Verify Experimental Features controls
        run: python3 scripts/test_experimental_settings.py
      - name: Carry-over guard (no problem of the old UI may return)
        run: python3 scripts/test_ui_no_carryover.py
      - name: UI layout lint (2.1.0 §13.8, R1-R10)
        run: python3 scripts/test_ui_layout_rules.py
      - name: Structure docs are current (sizes table, reviewed-for version, spec file)
        run: python3 scripts/test_structure_docs.py
      - name: Settings search index is current
        run: python3 scripts/make_settings_index.py --check
      - name: Navigation router and narrow-observation tests
        run: |
          swiftc -parse-as-library $(bash scripts/swift_sources.sh AppRouter ObjectSlice) Tests/Navigation/main.swift -o /tmp/navigation-tests
          /tmp/navigation-tests
      - name: UI model tests (2.1.0 SessionPhase)
        run: |
          swiftc -parse-as-library Shared/CaptureReadiness.swift $(bash scripts/swift_sources.sh SessionPhase) Tests/UIModel/main.swift -o /tmp/ui-model-tests
          /tmp/ui-model-tests
      - name: Check SQLite memory migration
        run: bash scripts/test_memory.sh
      - name: Check local capture transport
        run: bash scripts/test_transport.sh
      - name: Check diagnostic archive privacy and correlation
        run: bash scripts/test_diagnostics.sh
      - name: Check Test Runs storage, retention, recovery and migration
        run: bash scripts/test_test_runs.sh

  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"
      - name: Generate app icon
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install pillow
          python scripts/make_icon.py App/Assets.xcassets
      - run: brew install xcodegen && xcodegen generate
      - name: Build
        run: |
          set -euo pipefail
          xcodebuild -project ScreenLingo.xcodeproj -scheme ScreenLingo \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Verify app and extension metadata
        run: |
          python3 - <<'PY'
          import plistlib, re
          from pathlib import Path
          source = Path('Shared/Shared.swift').read_text()
          version = re.search(r'static let version = "([^"]+)"', source)[1]
          build = re.search(r'static let build = (\d+)', source)[1]
          app = Path('build/Build/Products/Release-iphoneos/ScreenLingo.app')
          extensions = list((app / 'PlugIns').glob('*.appex'))
          assert len(extensions) == 1, 'Expected one capture extension'
          for bundle in [app, *extensions]:
              with (bundle / 'Info.plist').open('rb') as f:
                  info = plistlib.load(f)
              assert info['CFBundleShortVersionString'] == version, info
              assert info['CFBundleVersion'] == build, info
              assert info['CFBundleIdentifier'].startswith('com.diam0ndnex.screenlingo'), info
          print(f'Verified app and extension: {version} ({build})')
          PY
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/ScreenLingo.app Payload/
          zip -qr ScreenLingo.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenLingo-ipa
          path: ScreenLingo.ipa
          if-no-files-found: error
          retention-days: 90
      - name: Preview interface on iPhone simulator
        if: github.event_name == 'workflow_dispatch' && inputs.interface_preview
        timeout-minutes: 12
        run: bash scripts/preview_interface.sh
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.interface_preview
        with:
          name: ScreenLingo-interface-preview
          path: interface-preview
          if-no-files-found: error
          retention-days: 90
